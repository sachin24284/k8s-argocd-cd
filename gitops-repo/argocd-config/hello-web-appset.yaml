apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello-web
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: prod
  template:
    metadata:
      name: 'hello-web-{{.env}}'
    spec:
      project: lab
      source:
        repoURL: https://github.com/sachin24284/k8s-argocd-cd.git
        targetRevision: main
        path: 'gitops-repo/workloads/hello-web/overlays/{{.env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'hello-{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
