apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-prod
resources:
  - ../../base
images:
  - name: hello-web
    newTag: 1.0.0
patches:
  - target:
      kind: Deployment
      name: hello-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
