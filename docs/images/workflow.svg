<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#455A64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
  .flow{stroke-dasharray:6 4;animation:dash .9s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-10}}
  .hl{fill:none;stroke:#FF6F00;stroke-width:4;opacity:0;animation:pulse 16s linear infinite}
  @keyframes pulse{0%{opacity:0}1%{opacity:1}8%{opacity:1}10%{opacity:0}100%{opacity:0}}
  .d0{animation-delay:0s}.d1{animation-delay:1.5s}.d2{animation-delay:3s}.d3{animation-delay:4.5s}
  .d4{animation-delay:6s}.d5{animation-delay:7.5s}.d6{animation-delay:9s}.d7{animation-delay:10.5s}
  .d8{animation-delay:12s}.d9{animation-delay:13.5s}
</style>

  <rect x="0" y="0" width="960" height="440" rx="10" fill="#ffffff" stroke="#CFD8DC"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">GitOps Workflow: from a Git commit to a healthy cluster</text>

  <!-- Stage 1 -->
  <circle cx="95" cy="78" r="12" fill="#1976D2"/><text x="95" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <rect x="30" y="96" width="130" height="92" rx="8" fill="#E1F5FE" stroke="#0288D1" stroke-width="1.5"/>
  <text x="95" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#01579B">Build</text>
  <text x="95" y="146" text-anchor="middle" font-size="11" fill="#263238">Docker build of</text>
  <text x="95" y="162" text-anchor="middle" font-size="11" fill="#263238">app + Argo CD image</text>

  <!-- Stage 2 -->
  <circle cx="250" cy="78" r="12" fill="#1976D2"/><text x="250" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <rect x="185" y="96" width="130" height="92" rx="8" fill="#F5F5F5" stroke="#424242" stroke-width="1.5"/>
  <text x="250" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#212121">Commit</text>
  <text x="250" y="146" text-anchor="middle" font-size="11" fill="#263238">Edit YAML in VS Code</text>
  <text x="250" y="162" text-anchor="middle" font-size="11" fill="#263238">git push to GitHub</text>

  <!-- Stage 3 -->
  <circle cx="405" cy="78" r="12" fill="#1976D2"/><text x="405" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <rect x="340" y="96" width="130" height="92" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="405" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A148C">Detect</text>
  <text x="405" y="146" text-anchor="middle" font-size="11" fill="#263238">Argo CD reads repo</text>
  <text x="405" y="162" text-anchor="middle" font-size="11" fill="#263238">Kustomize or Helm</text>

  <!-- Stage 4 -->
  <circle cx="560" cy="78" r="12" fill="#1976D2"/><text x="560" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4</text>
  <rect x="495" y="96" width="130" height="92" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="560" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A148C">Compare</text>
  <text x="560" y="146" text-anchor="middle" font-size="11" fill="#263238">Git vs live state</text>
  <text x="560" y="162" text-anchor="middle" font-size="11" fill="#263238">OutOfSync or Synced</text>

  <!-- Stage 5 -->
  <circle cx="715" cy="78" r="12" fill="#1976D2"/><text x="715" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">5</text>
  <rect x="650" y="96" width="130" height="92" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="715" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A148C">Sync</text>
  <text x="715" y="146" text-anchor="middle" font-size="11" fill="#263238">Hooks and waves</text>
  <text x="715" y="162" text-anchor="middle" font-size="11" fill="#263238">applies the change</text>

  <!-- Stage 6 -->
  <circle cx="870" cy="78" r="12" fill="#1976D2"/><text x="870" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">6</text>
  <rect x="805" y="96" width="130" height="92" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="870" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B5E20">Verify</text>
  <text x="870" y="146" text-anchor="middle" font-size="11" fill="#263238">Health checks</text>
  <text x="870" y="162" text-anchor="middle" font-size="11" fill="#263238">Healthy and Synced</text>

  <!-- Arrows between stages -->
  <line x1="162" y1="142" x2="183" y2="142" class="flow" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="317" y1="142" x2="338" y2="142" class="flow" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472" y1="142" x2="493" y2="142" class="flow" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="627" y1="142" x2="648" y2="142" class="flow" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="782" y1="142" x2="803" y2="142" class="flow" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop back -->
  <path d="M870 190 L870 228 L405 228 L405 190" fill="none" class="flow" stroke="#455A64" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="637" y="246" text-anchor="middle" font-size="12" fill="#263238">Continuous loop: Argo CD checks Git about every 3 minutes, or on Refresh</text>

  <!-- Self-heal row -->
  <text x="30" y="290" font-size="14" font-weight="bold" fill="#263238">Self-heal example</text>

  <rect x="30" y="306" width="190" height="64" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="125" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Manual change (drift)</text>
  <text x="125" y="352" text-anchor="middle" font-size="11" fill="#263238">kubectl scale to 5 replicas</text>

  <rect x="265" y="306" width="190" height="64" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="360" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A148C">Argo CD detects it</text>
  <text x="360" y="352" text-anchor="middle" font-size="11" fill="#263238">live state is OutOfSync</text>

  <rect x="500" y="306" width="190" height="64" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="595" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A148C">Auto-sync reverts it</text>
  <text x="595" y="352" text-anchor="middle" font-size="11" fill="#263238">back to 2 replicas (Git)</text>

  <rect x="735" y="306" width="190" height="64" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="830" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">Cluster matches Git</text>
  <text x="830" y="352" text-anchor="middle" font-size="11" fill="#263238">Healthy and Synced</text>

  <line x1="222" y1="338" x2="263" y2="338" class="flow" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="457" y1="338" x2="498" y2="338" class="flow" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="692" y1="338" x2="733" y2="338" class="flow" stroke="#455A64" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="412" text-anchor="middle" font-size="12" fill="#546E7A">Promotion: change newTag in the dev overlay first, push, then repeat for prod.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata>  <rect class="hl d0" x="30" y="96" width="130" height="92" rx="8"/>
  <rect class="hl d1" x="185" y="96" width="130" height="92" rx="8"/>
  <rect class="hl d2" x="340" y="96" width="130" height="92" rx="8"/>
  <rect class="hl d3" x="495" y="96" width="130" height="92" rx="8"/>
  <rect class="hl d4" x="650" y="96" width="130" height="92" rx="8"/>
  <rect class="hl d5" x="805" y="96" width="130" height="92" rx="8"/>
  <rect class="hl d6" x="30" y="306" width="190" height="64" rx="8"/>
  <rect class="hl d7" x="265" y="306" width="190" height="64" rx="8"/>
  <rect class="hl d8" x="500" y="306" width="190" height="64" rx="8"/>
  <rect class="hl d9" x="735" y="306" width="190" height="64" rx="8"/>

  <!-- moving tokens -->
  <circle r="6" fill="#FF6F00" stroke="#ffffff" stroke-width="1.5">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.469;1" path="M95,142 L870,142"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.469"/>
  </circle>
  <circle r="6" fill="#FF6F00" stroke="#ffffff" stroke-width="1.5">
    <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5625;0.9375;1" path="M125,338 L830,338"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5625;0.9375"/>
  </circle>
</svg>
