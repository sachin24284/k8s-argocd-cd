# Lives in the hello-web APP repo (push app-src/hello-web to GitHub as its own repo "hello-web").
# Needs a repo secret GITOPS_PAT: a personal access token with write access to argocd-lab-gitops.
# After the first run, set the ghcr.io package "hello-web" to Public so Docker Desktop can pull it.
name: build-push-bump
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/hello-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Bump image tag in GitOps repo (dev)
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git clone https://x-access-token:${GITOPS_PAT}@github.com/${OWNER}/argocd-lab-gitops.git gitops
          cd gitops
          cat > workloads/hello-web/overlays/dev/kustomization.yaml <<YAML
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: hello-dev
          resources:
            - ../../base
          images:
            - name: hello-web
              newName: ${IMAGE}
              newTag: ${{ github.sha }}
          YAML
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "ci: hello-web dev -> ${{ github.sha }}"
          git push
