name: CD - build, push and deploy to dev
on:
    push:
        branches: [main]
        paths:
            - "app-src/hello-web/**"
    workflow_dispatch:
permissions:
    contents: write
    packages: write
concurrency:
    group: cd-dev
    cancel-in-progress: false
jobs:
    build-push-bump:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set variables
              run: |
                  echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
                  echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: app-src/hello-web
                  push: true
                  build-args: VERSION=${{ env.SHORT_SHA }}
                  tags: ghcr.io/${{ env.OWNER }}/hello-web:${{ env.SHORT_SHA }}

            - name: Update the dev overlay with the new image
              run: |
                  cat > gitops-repo/workloads/hello-web/overlays/dev/kustomization.yaml <<EOF
                  apiVersion: kustomize.config.k8s.io/v1beta1
                  kind: Kustomization
                  namespace: hello-dev
                  resources:
                    - ../../base
                  images:
                    - name: hello-web
                      newName: ghcr.io/${OWNER}/hello-web
                      newTag: ${SHORT_SHA}
                  EOF

            - name: Commit the new tag
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add gitops-repo/workloads/hello-web/overlays/dev/kustomization.yaml
                  git diff --cached --quiet && echo 'No change' && exit 0
                  git commit -m "ci: deploy hello-web ${SHORT_SHA} to dev"
                  git pull --rebase origin main
                  git push origin main
