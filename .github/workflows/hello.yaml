name: hello
on: [push, workflow_dispatch]
jobs:
    say-hello:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Hello from GitHub Actions"
            - run: |
                  echo "Repo:   ${{ github.repository }}"
                  echo "Commit: ${{ github.sha }}"
                  echo "Actor:  ${{ github.actor }}"
